name: Jackdaw Publish Desktop Update

on:
  workflow_dispatch:
    inputs:
      release_type:
        type: choice
        description: GitHub Release type (use prerelease for -dev builds)
        options:
          - prerelease
          - release
        default: prerelease
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'desktop/**'
      - '.github/workflows/publish-desktop-jackdaw.yml'

concurrency:
  group: publish-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ota_build_suffix: ${{ steps.ota_suffix.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - name: OTA dev version suffix
        id: ota_suffix
        if: github.event_name == 'push' || inputs.release_type == 'prerelease'
        run: echo "value=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
      - name: Create release tag and GitHub prerelease
        if: github.event_name == 'push' || inputs.release_type == 'prerelease'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTA_BUILD_SUFFIX: ${{ steps.ota_suffix.outputs.value }}
        run: |
          BASE=$(node -p "require('./app/package.json').version.replace(/-dev.*/, '')")
          TAG="v${BASE}-dev.${OTA_BUILD_SUFFIX}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "$TAG" --force
          gh release delete "$TAG" --repo Uugsx/Jackdaw -y 2>/dev/null || true
          gh release create "$TAG" --repo Uugsx/Jackdaw --prerelease \
            --title "${BASE}-dev.${OTA_BUILD_SUFFIX}" \
            --notes "Jackdaw desktop prerelease."

  mac:
    needs: prepare
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: bash jackdaw-brand.sh
        working-directory: app/build
        shell: bash
        env:
          JACKDAW_GH_UPDATE_TOKEN: ${{ secrets.JACKDAW_GH_UPDATE_TOKEN }}
          OTA_BUILD_SUFFIX: ${{ needs.prepare.outputs.ota_build_suffix }}
      - run: sudo -H pip install setuptools
      - run: cd app; yarn install
      - run: cd lib; yarn install
      - run: cd desktop; yarn install
      - run: cd desktop/backend; yarn install
      - run: |
          mkdir -p ~/private_keys/
          echo '${{ secrets.APPLE_API_KEY }}' > ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
      - name: OAuth2 secrets stub for CI
        run: cp OAuth2Secrets.local.example.ts OAuth2Secrets.user.ts
        working-directory: app/logic/Auth
        shell: bash
      - run: cd desktop; yarn run build:release:mac
        if: github.event_name == 'workflow_dispatch' && inputs.release_type == 'release'
        env: &mac_env
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JACKDAW_GH_UPDATE_TOKEN: ${{ secrets.JACKDAW_GH_UPDATE_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
          APPLE_API_KEY: ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=32768'
      - run: cd desktop; yarn run build:publish:prerelease:mac
        if: github.event_name == 'push' || inputs.release_type == 'prerelease'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JACKDAW_GH_UPDATE_TOKEN: ${{ secrets.JACKDAW_GH_UPDATE_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=32768'

  windows:
    needs: prepare
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: bash fix-installer-filenames.sh
        working-directory: app/build
        shell: bash
      - run: bash jackdaw-brand.sh
        working-directory: app/build
        shell: bash
        env:
          JACKDAW_GH_UPDATE_TOKEN: ${{ secrets.JACKDAW_GH_UPDATE_TOKEN }}
          OTA_BUILD_SUFFIX: ${{ needs.prepare.outputs.ota_build_suffix }}
      - run: cd app; yarn install
      - run: cd lib; yarn install
      - run: cd desktop; yarn install
      - run: cd desktop/backend; yarn install
      - name: OAuth2 secrets stub for CI
        run: cp OAuth2Secrets.local.example.ts OAuth2Secrets.user.ts
        working-directory: app/logic/Auth
        shell: bash
      - run: cd desktop; yarn run build:release:win
        if: github.event_name == 'workflow_dispatch' && inputs.release_type == 'release'
        env: &win_env
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JACKDAW_GH_UPDATE_TOKEN: ${{ secrets.JACKDAW_GH_UPDATE_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=32768'
      - run: cd desktop; yarn run build:publish:prerelease:win
        if: github.event_name == 'push' || inputs.release_type == 'prerelease'
        env: *win_env

  finalize:
    needs: [prepare, mac, windows]
    if: github.event_name == 'push' || inputs.release_type == 'prerelease'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Clean GitHub release description and dedupe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTA_BUILD_SUFFIX: ${{ needs.prepare.outputs.ota_build_suffix }}
        run: |
          BASE=$(node -p "require('./app/package.json').version.replace(/-dev.*/, '')")
          TAG="v${BASE}-dev.${OTA_BUILD_SUFFIX}"
          IDS=$(gh api "repos/Uugsx/Jackdaw/releases?per_page=100" --jq ".[] | select(.tag_name==\"$TAG\") | .id")
          KEEP=$(gh api "repos/Uugsx/Jackdaw/releases?per_page=100" \
            --jq "[.[] | select(.tag_name==\"$TAG\")] | max_by(.assets | length) | .id // empty")
          for ID in $IDS; do
            if [ "$ID" != "$KEEP" ]; then
              gh api -X DELETE "repos/Uugsx/Jackdaw/releases/$ID"
            fi
          done
          if [ -n "$KEEP" ]; then
            gh api -X PATCH "repos/Uugsx/Jackdaw/releases/$KEEP" \
              -f body="Jackdaw desktop prerelease." \
              -f name="${BASE}-dev.${OTA_BUILD_SUFFIX}"
          fi
